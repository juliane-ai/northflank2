name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          set -eu
          failed=0
          while IFS= read -r -d '' file; do
            sh -n "$file" || failed=1
          done < <(find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name 'entrypoint.sh' \) -print0)
          exit "$failed"
      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py
      - name: Test research state merge
        run: python3 scripts/test_publish.py
